<html>

<style>
    body {

    }

    input, select, textarea {

        padding: 0.9rem;

        border-radius: 8px;
        background-color: white;
        font-size: 1.08rem; 
        transition: all 0.2s;
        box-sizing: border-box;
    }

    input[type="checkbox"] {

        border: 1px solid #cbd5e1;

        background-color: white;

    }

        border-radius: 12px;

    }

        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
    }

        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .chart-container {
        background: white;

        padding: 1.5rem;

    .menu-toggle {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1100;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0.5rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 39.6px; 
        height: 39.6px; 
        transition: all 0.2s;
    }

    .menu-toggle:hover {
        background: #f8fafc;
        transform: translateY(-1px);
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .hamburger {
        position: relative;
        width: 19.8px; 
        height: 2px;
        background: #475569;
        border-radius: 2px;
        transition: all 0.3s;
    }

    .hamburger::before,
    .hamburger::after {
        content: '';
        position: absolute;
        width: 19.8px; 
        height: 2px;
        background: #475569;
        border-radius: 2px;
        transition: all 0.3s;
    }

    .hamburger::before {
        transform: translateY(-6px);
    }

    .hamburger::after {
        transform: translateY(6px);
    }

    .menu-toggle.active .hamburger {
        background: transparent;
    }

    .menu-toggle.active .hamburger::before {
        transform: rotate(45deg);
    }

    .menu-toggle.active .hamburger::after {
        transform: rotate(-45deg);
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.5);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;

        gap: 2rem;

    }

        padding: 0 1rem;
    }

function updateFinancialDashboard() {
  const servicos = gestaoServicos.servicos;
  const totalPaid = servicos.filter(s => s.dataPagamento).reduce((sum, s) => sum + s.valor, 0);
  const totalPending = servicos.filter(s => !s.dataPagamento).reduce((sum, s) => sum + s.valor, 0);
  const totalAmount = totalPaid + totalPending;
  document.getElementById('totalPending').textContent = `R$ ${totalPending.toFixed(2)}`;
  document.getElementById('totalPaid').textContent = `R$ ${totalPaid.toFixed(2)}`;
  document.getElementById('totalAmount').textContent = `R$ ${totalAmount.toFixed(2)}`;
  const statusCtx = document.getElementById('statusChart').getContext('2d');
  new Chart(statusCtx, {
    type: 'pie',
    data: {
      labels: ['Pago', 'Pendente'],
      datasets: [{
        data: [totalPaid, totalPending],
        backgroundColor: ['#28a745', '#dc3545']
      }]
    },
    options: {
      responsive: true,
      plugins: {
        title: {
          display: true,
          text: 'Distribuição de Pagamentos'
        }
      }
    }
  });
  const monthlyData = getMonthlyData(servicos);
  const monthlyCtx = document.getElementById('monthlyChart').getContext('2d');
  new Chart(monthlyCtx, {
    type: 'bar',
    data: {
      labels: monthlyData.labels,
      datasets: [{
        label: 'Valores Pagos',
        data: monthlyData.paid,
        backgroundColor: '#28a745',
        borderColor: '#28a745',
        borderWidth: 1
      }, {
        label: 'Valores Pendentes',
        data: monthlyData.pending,
        backgroundColor: '#dc3545',
        borderColor: '#dc3545',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          stacked: false
        },
        y: {
          stacked: false,
          beginAtZero: true,
          ticks: {
            callback: function (value) {
              return 'R$ ' + value.toFixed(2);
            }
          }
        }
      },
      plugins: {
        title: {
          display: true,
          text: 'Valores por Mês'
        }
      }
    }
  });
}

function getMonthlyData(servicos) {
  const monthsMap = new Map();
  servicos.forEach(servico => {
    const date = new Date(servico.data);
    const monthKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
    if (!monthsMap.has(monthKey)) {
      monthsMap.set(monthKey, {
        paid: 0,
        pending: 0,
        monthName: date.toLocaleString('pt-BR', {
          month: 'long',
          year: 'numeric'
        })
      });
    }
    if (servico.dataPagamento) {
      monthsMap.get(monthKey).paid += servico.valor;
    } else {
      monthsMap.get(monthKey).pending += servico.valor;
    }
  });
  const sortedMonths = Array.from(monthsMap.entries()).sort((a, b) => b[0].localeCompare(a[0]));
  return {
    labels: sortedMonths.map(([_, data]) => data.monthName),
    paid: sortedMonths.map(([_, data]) => data.paid),
    pending: sortedMonths.map(([_, data]) => data.pending)
  };
}
function showImageModal(imageUrl) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <img src="${imageUrl}" class="modal-image" id="modalImage">
        </div>
    `;
  document.body.appendChild(modal);
  modal.style.display = 'flex';
  const image = document.getElementById('modalImage');
  let scale = 1;
  let isDragging = false;
  let startX,
    startY,
    translateX = 0,
    translateY = 0;
  let initialDistance = 0;
  modal.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    }
  });
  modal.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
      const delta = currentDistance - initialDistance;
      const newScale = Math.min(Math.max(scale + delta * 0.01, 1), 4);
      image.style.transform = `scale(${newScale}) translate(${translateX}px, ${translateY}px)`;
      scale = newScale;
      initialDistance = currentDistance;
    }
  });
  modal.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY * -0.01;
    const newScale = Math.min(Math.max(scale + delta, 1), 4);
    scale = newScale;
    image.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
  });
  modal.addEventListener('mousedown', e => {
    if (e.target === image) {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    }
  });
  modal.addEventListener('mousemove', e => {
    if (isDragging) {
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      image.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
    }
  });
  modal.addEventListener('mouseup', () => {
    isDragging = false;
  });
  const closeModal = () => {
    modal.style.display = 'none';
    modal.remove();
  };
  modal.querySelector('.modal-close').addEventListener('click', closeModal);
  modal.addEventListener('click', e => {
    if (e.target === modal) {
      closeModal();
    }
  });
}
function generateICSFile() {
  const icsContent = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Papa Cotas//Calendar//PT'].join('\r\n');
  const events = gestaoServicos.servicos.map(servico => {
    const date = new Date(servico.data);
    const dateStr = date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const timeStr = servico.horaInicio ? `${servico.data}T${servico.horaInicio}:00` : servico.data;
    const endTimeStr = servico.horaTermino ? `${servico.data}T${servico.horaTermino}:00` : servico.data;
    return ['BEGIN:VEVENT', `UID:${servico.id}@papacotas`, `DTSTAMP:${dateStr}`, `DTSTART:${timeStr.replace(/[-:]/g, '')}`, `DTEND:${endTimeStr.replace(/[-:]/g, '')}`, `SUMMARY:${servico.tipoServico} - ${servico.operacao}`, `DESCRIPTION:Valor: R$ ${servico.valor.toFixed(2)}\\n${servico.isRepasse ? `QRA: ${servico.qra}\\nSEI: ${servico.sei}` : ''}`, 'END:VEVENT'].join('\r\n');
  }).join('\r\n');
  const finalContent = [icsContent, events, 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([finalContent], {
    type: 'text/calendar;charset=utf-8'
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'papa_cotas_calendario.ics';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

    return tabContent;

  showTab(year) {
    this.tabButtons.querySelectorAll('.tab-button').forEach(button => {
      button.classList.remove('active');
      if (button.textContent === year.toString()) {
        button.classList.add('active');
      }
    });
    this.tabContents.innerHTML = '';
    const tabContent = this.createTabContent(year);
    this.tabContents.appendChild(tabContent);
    tabContent.classList.add('active');
  }
  loadServicos() {
    this.createTabButtons();
  }
  getStatusIcon(isPago) {
    if (isPago) {
      return `<div class="status-icon pago">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <circle cx="12" cy="12" r="10" fill="#16a34a"/>
            </svg>
        </div>`;
    } else {
      return `<div class="status-icon pendente">
            <svg viewBox="0 0 24 24" width="16" height="16">
                <circle cx="12" cy="12" r="10" fill="#dc2626"/>
            </svg>
        </div>`;
    }
  }
  toggleRepasseFields(e) {
    const repasseFields = document.getElementById('repasseFields');
    const isChecked = document.getElementById('isRepasse').checked;
    repasseFields.style.display = isChecked ? 'block' : 'none';
  }
  toggleAreaAtuacaoField(e) {
    const areaAtuacaoField = document.getElementById('areaAtuacaoField');
    const isChecked = document.getElementById('isAreaAtuacao').checked;
    areaAtuacaoField.style.display = isChecked ? 'block' : 'none';
  }
  toggleObservacoesField(e) {
    const observacoesField = document.getElementById('observacoesField');
    const isChecked = document.getElementById('hasObservacoes').checked;
    observacoesField.style.display = isChecked ? 'block' : 'none';
  }
  handleSubmit(e) {
    e.preventDefault();
    const isRepasse = document.getElementById('isRepasse').checked;
    const editingId = this.form.dataset.editingId;
    const anexosInput = document.getElementById('anexos');
    const files = Array.from(anexosInput.files);
    const anexos = [];
    const processFiles = async () => {
      for (const file of files) {
        const base64 = await this.fileToBase64(file);
        anexos.push(base64);
      }
      const observacoes = document.getElementById('hasObservacoes').checked ? document.getElementById('observacoes').value : '';
      const areaAtuacao = document.getElementById('isAreaAtuacao').checked ? document.getElementById('areaAtuacao').value : '';
      const servico = new ServicoExtraordinario(document.getElementById('data').value, document.getElementById('tipoServico').value, document.getElementById('operacao').value, parseFloat(document.getElementById('valor').value), document.getElementById('dataPagamento').value, isRepasse, isRepasse ? document.getElementById('qra').value : '', isRepasse ? document.getElementById('sei').value : '', isRepasse ? document.getElementById('bonus').value : '', anexos, document.getElementById('horaInicio').value, document.getElementById('horaTermino').value, observacoes, areaAtuacao);
      if (editingId) {
        const index = this.servicos.findIndex(s => s.id === editingId);
        if (index !== -1) {
          servico.id = editingId;
          if (anexos.length === 0) {
            servico.anexos = this.servicos[index].anexos;
          }
          this.servicos[index] = servico;
        }
        this.form.dataset.editingId = '';
      } else {
        this.servicos.push(servico);
      }
      this.saveServicos();
      this.loadServicos();
      this.form.reset();
      document.getElementById('repasseFields').style.display = 'none';
      document.getElementById('areaAtuacaoField').style.display = 'none';
      document.getElementById('preview-container').innerHTML = '';
    };
    processFiles();
  }
  fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }
  editServico(id) {
    const servico = this.servicos.find(s => s.id === id);
    if (servico) {
      document.getElementById('data').value = servico.data;
      document.getElementById('tipoServico').value = servico.tipoServico;
      document.getElementById('operacao').value = servico.operacao;
      document.getElementById('valor').value = servico.valor;
      document.getElementById('dataPagamento').value = servico.dataPagamento || '';
      document.getElementById('isRepasse').checked = servico.isRepasse;
      const repasseFields = document.getElementById('repasseFields');
      repasseFields.style.display = servico.isRepasse ? 'block' : 'none';
      if (servico.isRepasse) {
        document.getElementById('qra').value = servico.qra || '';
        document.getElementById('sei').value = servico.sei || '';
        document.getElementById('bonus').value = servico.bonus || '';
      }
      const previewContainer = document.getElementById('preview-container');
      previewContainer.innerHTML = '';
      servico.anexos?.forEach((anexo, index) => {
        const imagePreview = document.createElement('div');
        imagePreview.className = 'image-preview';
        imagePreview.innerHTML = `
                <img src="${anexo}" class="preview-image" alt="Anexo ${index + 1}">
                <button class="remove-image" data-index="${index}">&times;</button>
            `;
        previewContainer.appendChild(imagePreview);
      });
      document.getElementById('horaInicio').value = servico.horaInicio || '';
      document.getElementById('horaTermino').value = servico.horaTermino || '';
      document.getElementById('hasObservacoes').checked = !!servico.observacoes;
      const observacoesField = document.getElementById('observacoesField');
      observacoesField.style.display = servico.observacoes ? 'block' : 'none';
      if (servico.observacoes) {
        document.getElementById('observacoes').value = servico.observacoes;
      }
      document.getElementById('isAreaAtuacao').checked = !!servico.areaAtuacao;
      const areaAtuacaoField = document.getElementById('areaAtuacaoField');
      areaAtuacaoField.style.display = servico.areaAtuacao ? 'block' : 'none';
      if (servico.areaAtuacao) {
        document.getElementById('areaAtuacao').value = servico.areaAtuacao;
      }
      document.getElementById('servicoForm').dataset.editingId = id;
    }
  }
  deleteServico(id) {
    if (confirm('Tem certeza que deseja excluir este registro?')) {
      this.servicos = this.servicos.filter(servico => servico.id !== id);
      this.saveServicos();
      this.loadServicos();
    }
  }
  saveServicos() {
    localStorage.setItem('servicos', JSON.stringify(this.servicos));
  }
  saveUnavailableDays() {
    localStorage.setItem('unavailableDays', JSON.stringify(this.unavailableDays));
  }
  generateReportData(period = 'all', customMonth = null) {
    const now = new Date();
    let startDate = new Date(0);
    let endDate = new Date();
    
    if (period === 'custom' && customMonth) {
      const [year, month] = customMonth.split('-');
      startDate = new Date(year, month - 1, 1);
      endDate = new Date(year, month, 0); // Last day of the selected month
    } else {
      switch (period) {
        case 'week':
          startDate = new Date(now.setDate(now.getDate() - 7));
          break;
        case 'biweek':
          startDate = new Date(now.setDate(now.getDate() - 15));
          break;
        case 'month':
          startDate = new Date(now.setMonth(now.getMonth() - 1));
          break;
        case 'quarter':
          startDate = new Date(now.setMonth(now.getMonth() - 3));
          break;
        case 'semester':
          startDate = new Date(now.setMonth(now.getMonth() - 6));
          break;
        case 'year':
          startDate = new Date(now.setFullYear(now.getFullYear() - 1));
          break;
      }
    }

    const filteredServices = this.servicos.filter(service => {
      const serviceDate = new Date(service.data);
      return period === 'custom' ? 
        (serviceDate >= startDate && serviceDate <= endDate) :
        serviceDate >= startDate;
    });

    const serviceTypes = {};
    const operations = {};
    const timeSlots = {};
    let servicesPaid = 0;
    let servicesPending = 0;

    filteredServices.forEach(service => {
      serviceTypes[service.tipoServico] = (serviceTypes[service.tipoServico] || 0) + 1;
      operations[service.operacao] = (operations[service.operacao] || 0) + 1;
      
      if (service.horaInicio) {
        const hour = parseInt(service.horaInicio.split(':')[0]);
        const slot = `${hour.toString().padStart(2, '0')}:00`;
        timeSlots[slot] = (timeSlots[slot] || 0) + 1;
      }

      if (service.dataPagamento) {
        servicesPaid++;
      } else {
        servicesPending++;
      }
    });

    return {
      serviceTypes: Object.entries(serviceTypes).sort((a, b) => b[1] - a[1]).slice(0, 10),
      operations: Object.entries(operations).sort((a, b) => b[1] - a[1]).slice(0, 10),
      timeSlots: Object.entries(timeSlots).sort((a, b) => b[1] - a[1]),
      servicesPaid,
      servicesPending
    };
  }

  duplicateServico(id) {
    const servico = this.servicos.find(s => s.id === id);
    if (servico) {
      const duplicatedServico = {
        ...servico
      };
      duplicatedServico.id = Date.now().toString();
      duplicatedServico.dataPagamento = '';
      this.servicos.push(duplicatedServico);
      this.saveServicos();
      this.loadServicos();
    }
  }
}

function downloadBackup() {
  const data = {
    servicos: gestaoServicos.servicos,
    unavailableDays: gestaoServicos.unavailableDays
  };
  
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  
  link.href = url;
  link.download = `papa_cotas_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function handleRestore(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      
      if (data.servicos && Array.isArray(data.servicos)) {
        localStorage.setItem('servicos', JSON.stringify(data.servicos));
      }
      
      if (data.unavailableDays && Array.isArray(data.unavailableDays)) {
        localStorage.setItem('unavailableDays', JSON.stringify(data.unavailableDays));
      }

      alert('Backup restaurado com sucesso! A página será recarregada.');
      window.location.reload();
    } catch (error) {
      alert('Erro ao restaurar o backup. Verifique se o arquivo é válido.');
    }
  };
  reader.readAsText(file);
}
</script>
</body>
</html>
